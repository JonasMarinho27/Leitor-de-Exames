
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Exames Laboratoriais</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #2c3e50;
    }
    .container {
      background: #ffffff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 700px;
    }
    input, button {
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eef2f7;
      border-radius: 5px;
      white-space: pre-wrap;
    }
    #copyBtn {
      margin-top: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    #copyBtn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>Leitor de Exames Laboratoriais</h1>
  <div class="container">
    <input type="file" id="imageInput" accept="image/*"><br>
    <button onclick="processImage()">Ler Exame</button>
    <div id="result">Texto extraído aparecerá aqui...</div>
    <button id="copyBtn" onclick="copyToClipboard()">Copiar resultados</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    function preprocessImage(file, callback) {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function (e) {
        img.src = e.target.result;
      };
      img.onload = function () {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          data[i] = avg > 128 ? 255 : 0;
          data[i + 1] = avg > 128 ? 255 : 0;
          data[i + 2] = avg > 128 ? 255 : 0;
        }
        ctx.putImageData(imageData, 0, 0);
        callback(canvas.toDataURL());
      };
      reader.readAsDataURL(file);
    }

    function processImage() {
      const imageInput = document.getElementById('imageInput');
      const result = document.getElementById('result');
      result.textContent = 'Processando imagem...';

      if (!imageInput.files[0]) {
        result.textContent = 'Por favor, selecione uma imagem.';
        return;
      }

      preprocessImage(imageInput.files[0], function (dataUrl) {
        Tesseract.recognize(dataUrl, 'por', { logger: m => console.log(m) })
          .then(({ data: { text } }) => {
            const linhas = text.split('\n').map(l => l.trim()).filter(l => l.length > 3);

            const dataMatch = text.match(/(\d{2}[/\-]\d{2}[/\-]\d{4})/);
            const data = dataMatch ? dataMatch[1] : 'Data não encontrada';

            const exames = linhas
              .filter(l => /(Hemoglobina|Hematócrito|Leucócitos|Plaquetas|Creatinina|Ureia|ALT|AST|TGO|TGP|Fosfatase|Gama|Bilirrubina|Glicose|Colesterol|Triglicer|PCR|TSH|T4|T3)/i.test(l))
              .map(l => {
                const partes = l.match(/^([\w()çÇéÉíÍãõâêô\-]+)\s+([\d.,]+)\s*([\w/%µ]+)?/);
                if (partes) {
                  const nome = partes[1];
                  const valor = partes[2];
                  const unidade = partes[3] || '';
                  return `${nome} ${valor} ${unidade}`.trim();
                }
                return null;
              })
              .filter(Boolean);

            const saidaFinal = `LAB (${data}) ` + exames.join(' // ');
            result.textContent = saidaFinal;
          });
      });
    }

    function copyToClipboard() {
      const text = document.getElementById('result').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Resultados copiados!');
      });
    }
  </script>
</body>
</html>
