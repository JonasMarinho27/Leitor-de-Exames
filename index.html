
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Leitor Inteligente de Exames</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      padding: 40px;
      text-align: center;
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 30px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2a5d9f;
    }
    input, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background-color: #2a5d9f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1c4172;
    }
    #output {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef2f7;
      border-radius: 5px;
      min-height: 100px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Leitor Inteligente de Exames</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="processImage()">Ler Exame</button>
    <button onclick="copiarTexto()">Copiar Resultados</button>
    <div id="output">Resultado aparecerá aqui...</div>
  </div>

  <script>
    const parametrosEsperados = [
      'Hemoglobina', 'Hematócrito', 'Leucócitos', 'Plaquetas', 'VCM', 'HCM', 'CHCM', 'RDW',
      'Neutrófilos', 'Linfócitos', 'Monócitos', 'Eosinófilos', 'Basófilos',
      'Creatinina', 'Uréia', 'Clearence',
      'TGO', 'AST', 'TGP', 'ALT', 'GGT', 'Bilirrubina', 'Fosfatase', 'Albumina',
      'Glicose', 'Sódio', 'Potássio', 'Cálcio',
      'TSH', 'T4',
      'Densidade', 'pH', 'Glicose', 'Proteína', 'Hemoglobina', 'Cilindros', 'Cetonas',
      'Urobilinogênio', 'Nitrito', 'Aspecto', 'Leucócitos',
      'PCR', 'VHS'
    ];

    function processImage() {
      const imageInput = document.getElementById('imageInput');
      const output = document.getElementById('output');
      output.textContent = 'Processando imagem...';

      if (!imageInput.files[0]) {
        output.textContent = 'Por favor, selecione uma imagem.';
        return;
      }

      Tesseract.recognize(
        imageInput.files[0],
        'por',
        { logger: m => console.log(m) }
      ).then(({ data: { text } }) => {
        const linhas = text.split('\n');
        const resultados = [];

        for (const linha of linhas) {
          for (const parametro of parametrosEsperados) {
            const regex = new RegExp(`(${parametro})[^\d]*(\d+[.,]?\d*)`, 'i');
            const match = linha.match(regex);
            if (match) {
              resultados.push(`${match[1]} ${match[2]}`);
              break;
            }
          }
        }

        const dataMatch = text.match(/(Data|Coleta).*?(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
        let resultadoFinal = dataMatch ? `Data da coleta: ${dataMatch[2]} // ` : '';
        resultadoFinal += resultados.join(' // ');

        output.textContent = resultadoFinal || "Nenhum exame relevante encontrado.";
      });
    }

    function copiarTexto() {
      const texto = document.getElementById('output').textContent;
      navigator.clipboard.writeText(texto).then(() => {
        alert('Resultado copiado!');
      });
    }
  </script>
</body>
</html>
